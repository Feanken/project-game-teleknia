name: Game checks
on:
  push:
  pull_request:
jobs:
  campaign:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and resolve dependencies
        run: mvn -B test-compile
      - name: Headless campaign and essentials integration checks
        shell: pwsh
        run: ./scripts/check-game.ps1
